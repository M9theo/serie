<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Série"><meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><style>html,body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Série</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout : app mobile une colonne, barre d'onglets fixe en bas, feuilles modales. DA : blanc, rouge pour l'essentiel, noir pour le texte et les actions secondaires, gris pour le reste */
:root{
  --bg:#FFFFFF; --surface:#F4F4F5; --surface-2:#FFFFFF; --line:#E6E6E8; --line-2:#D4D4D8;
  --fg:#111111; --muted:#626268; --faint:#76767C;
  --accent:#D7261E; --on-accent:#FFFFFF; --accent-soft:#FDECEA;
  --good:#1A7F45; --good-soft:#E7F5ED; --warn:#A15C00; --warn-soft:#FEF3E2; --bad:#B42318; --bad-soft:#FDECEA;
  --nav:#FFFFFF; --data:#111111; --timer:#111111; --timer-fill:#2A2A2D; --timer-fg:#FFFFFF;
  --font-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E10; --surface:#1A1A1D; --surface-2:#232327; --line:#2C2C31; --line-2:#3A3A40;
  --fg:#F4F4F5; --muted:#A1A1AA; --faint:#8E8E96;
  --accent:#EF3B32; --on-accent:#FFFFFF; --accent-soft:#3A1614;
  --good:#3CCB7F; --good-soft:#12291D; --warn:#F5B841; --warn-soft:#2D2410; --bad:#FF6B6B; --bad-soft:#331616;
  --nav:#111113; --data:#E4E4E7; --timer:#232327; --timer-fill:#34343A; --timer-fg:#FFFFFF; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E0E10; --surface:#1A1A1D; --surface-2:#232327; --line:#2C2C31; --line-2:#3A3A40;
  --fg:#F4F4F5; --muted:#A1A1AA; --faint:#8E8E96;
  --accent:#EF3B32; --on-accent:#FFFFFF; --accent-soft:#3A1614;
  --good:#3CCB7F; --good-soft:#12291D; --warn:#F5B841; --warn-soft:#2D2410; --bad:#FF6B6B; --bad-soft:#331616;
  --nav:#111113; --data:#E4E4E7; --timer:#232327; --timer-fill:#34343A; --timer-fg:#FFFFFF; color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
@media (display-mode: standalone){.app{padding-top:calc(28px + max(env(safe-area-inset-top,0px), 47px))}#layer .sheet{max-height:calc(100vh - max(env(safe-area-inset-top,0px), 47px) - 12px)}}
.app.live{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.xs{font-size:12px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}.stack-s{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tile{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.big{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px;border:none;width:100%;text-align:left;color:var(--fg)}
.bar{width:4px;align-self:stretch;min-height:30px;border-radius:2px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.btn{height:50px;border-radius:16px;border:none;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--surface-2);color:var(--fg);border:1px solid var(--line-2)}
.btn.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line-2)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.btn.sm{height:38px;font-size:14px;border-radius:12px;padding:0 14px}
.btn.full{width:100%}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--fg);flex:none}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;gap:4px;background:var(--surface);border-radius:12px;padding:4px}
.seg button{height:36px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:0 6px}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:700}
.badge{font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.badge.soft{background:var(--surface-2);color:var(--muted);font-weight:600}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
label.field{display:flex;flex-direction:column;gap:4px;min-width:0}
label.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.inp{height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 12px;font-size:16px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;font-size:14px;border:1px solid}
.alert.good{background:var(--good-soft);border-color:var(--good);color:var(--fg)}.alert.warn{background:var(--warn-soft);border-color:var(--warn)}.alert.bad{background:var(--bad-soft);border-color:var(--bad)}
.alert svg{flex:none;margin-top:1px}
.empty{border:1px dashed var(--line-2);border-radius:16px;padding:18px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:84px;padding:4px 0;color:var(--faint);font-size:12px;font-weight:600}
.nav button.on{color:var(--accent);font-weight:700}
/* sets */
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px minmax(0,1fr) 76px 60px 44px;gap:6px;align-items:center;border-radius:12px;padding:4px 0}
.set.bw{grid-template-columns:30px minmax(0,1fr) 92px 56px 44px}
.set.dur{grid-template-columns:30px minmax(0,1fr) 96px 44px}
.set.done{background:var(--accent-soft)}
.set .n{text-align:center;font-weight:700}
.set .prev{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set input{height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);text-align:center;font-weight:700;font-size:17px;width:100%;min-width:0;padding:0 4px}
.set.done input{border-color:transparent;background:transparent}
.chk{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:transparent;display:flex;align-items:center;justify-content:center;padding:0;color:var(--muted)}
.set.done .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sethead{display:grid;grid-template-columns:30px minmax(0,1fr) 76px 60px 44px;gap:6px;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.sethead.bw{grid-template-columns:30px minmax(0,1fr) 92px 56px 44px}.sethead.dur{grid-template-columns:30px minmax(0,1fr) 96px 44px}
.set.focus{box-shadow:inset 0 0 0 2px var(--fg);border-radius:12px}
.stepper{display:flex;gap:10px;justify-content:space-between;padding:4px 2px 6px 36px;flex-wrap:wrap}
.stpg{display:flex;flex-direction:column;gap:4px}
.stp{width:52px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);font-size:22px;font-weight:700;padding:0;line-height:1}
.stp:active{background:var(--fg);color:var(--bg)}
.bwmode{display:flex;gap:4px}
.bwmode button{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line-2);background:transparent;color:var(--muted);font-size:12px;font-weight:600}
.bwmode button.on{background:var(--surface-2);color:var(--fg);border-color:var(--fg)}
.decide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.decide button{height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:700;font-size:14px}
.decide button.on.up{background:var(--good);border-color:var(--good);color:#FFFFFF}
.decide button.on.keep{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.decide button.on.down{background:var(--warn);border-color:var(--warn);color:#FFFFFF}
/* timer */
.timer{color:var(--timer-fg);position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;height:70px;border-radius:20px;background:var(--timer);border:none;display:flex;align-items:center;gap:10px;padding:0 10px;overflow:hidden;z-index:25}
.timer .fill{position:absolute;left:0;top:0;bottom:0;background:var(--timer-fill);transition:width .3s linear}
.timer>*{position:relative}
.timer .t{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1}
.timer.over{box-shadow:inset 0 0 0 2px var(--accent)}
.timer .btn.sec,.timer .icon-btn{background:rgba(255,255,255,.12);border:none;color:var(--timer-fg)}
.timer .btn.sec[data-v="15"]{background:var(--accent)}
.timer #tlab{color:rgba(255,255,255,.7)!important}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{text-align:center;font-size:12px;color:var(--faint);font-weight:600}
.cal button{height:52px;border-radius:12px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;color:var(--fg);font-weight:600}
.cal button.out{color:var(--line-2)}
.cal button.sel{border-color:var(--accent);background:var(--surface-2)}
.cal button .num{font-size:15px;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.cal button.today .num{background:var(--accent);color:var(--on-accent)}
.cal .dots{display:flex;gap:3px;height:6px}.cal .dots span{width:6px;height:6px;border-radius:3px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);align-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:18px;border:3px solid transparent;padding:0}
.swatches button.on{border-color:var(--fg)}
.chart{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;top:0;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:10px;padding:5px 10px;font-size:12px;display:flex;flex-direction:column;align-items:center;white-space:nowrap;pointer-events:none;z-index:2;line-height:1.3}
.chart .tip b{font-size:15px}
.chart .guide{position:absolute;top:0;width:1px;background:var(--muted);pointer-events:none}
.chart .hl{position:absolute;width:12px;height:12px;border-radius:6px;background:var(--bg);border:3px solid var(--accent);transform:translate(-50%,-50%);pointer-events:none}
.set .n{background:none;border:none;color:var(--fg);height:40px;padding:0;font-size:15px}
.set.warm .n{color:var(--warn)}
.set.warm input{font-weight:500;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.hbar{height:12px;border-radius:6px;background:var(--surface-2);position:relative}
.hbar .z{position:absolute;top:-3px;bottom:-3px;border-radius:4px;background:var(--good);opacity:.22}
.hbar .v{position:absolute;left:0;top:2px;height:8px;border-radius:4px}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.heat span{border-radius:3px;background:var(--surface-2)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:8px 0;border-bottom:1px solid var(--line)}
table.t td:last-child{text-align:right;font-weight:700}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.ss-tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.card.ss{box-shadow:inset 3px 0 0 var(--accent)}
</style>
<div id="splash" aria-hidden="true" style="position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s ease"><svg width="96" height="96" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#D7261E"/><rect x="20" y="56" width="15" height="24" rx="3" fill="#FFFFFF"/><rect x="42" y="40" width="15" height="40" rx="3" fill="#FFFFFF"/><rect x="64" y="22" width="15" height="58" rx="3" fill="#FFFFFF"/></svg><span style="font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:-.02em;color:var(--fg)">Série</span></div>

<script>
'use strict';
/* ---------- constantes ---------- */
const KEY = 'carnet-seances-v1';
const MUSCLES = ['Pecs','Dos','Épaules','Biceps','Triceps','Quadriceps','Ischios','Fessiers','Mollets','Abdos','Autre'];
const COLORS = ['#2F6FEB','#EA580C','#7C3AED','#D97706','#0D9488','#DB2777','#4F46E5','#52525B'];
const FOOT_COLOR = '#16A34A';
const SPORTS = {foot:{label:'Foot', color:'#16A34A', formats:['Match','Entraînement','Five'], dur:90, note:'Sensations, poste, gêne…', f:'m'}, piscine:{label:'Natation', color:'#0891B2', formats:null, dur:45, note:'Nages, distance, sensations…', f:'f'}};
function sportOf(a){ return SPORTS[(a && a.kind) || 'foot'] || SPORTS.foot; }
const TYPES = {weight:'Charge + reps', bodyweight:'Poids du corps', duration:'Durée'};
const PHASES = {prise:'Prise de masse', seche:'Sèche', maintien:'Maintien', perso:'Objectif perso'};
const MEASURES = ['Bras','Poitrine','Épaules','Taille','Hanches','Cuisse','Mollet','Cou'];
const BAR_DEFAULT = ['Développé couché','Rowing barre','Développé militaire','Curl barre','Squat','Soulevé de terre roumain','Hip thrust'];
const DEFAULT_TARGETS = {Pecs:[10,16],Dos:[12,20],'Épaules':[10,16],Biceps:[8,14],Triceps:[8,14],Quadriceps:[10,16],Ischios:[8,14],Fessiers:[6,12],Mollets:[6,12],Abdos:[6,12],Autre:[0,10]};

function defaultExercises(){
  const L = [
    ['Développé couché','Pecs','weight',2.5],['Développé incliné haltères','Pecs','weight',2],['Dips','Pecs','bodyweight',1.25],
    ['Tractions','Dos','bodyweight',1.25],['Rowing barre','Dos','weight',2.5],['Tirage vertical','Dos','weight',2.5],['Rowing poulie','Dos','weight',2.5],
    ['Développé militaire','Épaules','weight',2.5],['Élévations latérales','Épaules','weight',1],
    ['Curl barre','Biceps','weight',1.25],['Curl incliné haltères','Biceps','weight',1],['Extension triceps poulie','Triceps','weight',2.5],
    ['Squat','Quadriceps','weight',2.5],['Presse à cuisses','Quadriceps','weight',5],['Soulevé de terre roumain','Ischios','weight',2.5],['Leg curl','Ischios','weight',2.5],
    ['Hip thrust','Fessiers','weight',5],['Mollets debout','Mollets','weight',2.5],['Gainage','Abdos','duration',5],['Relevés de jambes','Abdos','bodyweight',1.25]
  ];
  return L.map(([name,muscle,type,step]) => ({id:uid(), name, muscle, type, step, bar: BAR_DEFAULT.includes(name)}));
}
function blank(){
  return {v:1, exercises:defaultExercises(), templates:[], sessions:[], activities:[], weights:[], measures:[], phases:[], plan:{},
    targets:JSON.parse(JSON.stringify(DEFAULT_TARGETS)),
    settings:{theme:'auto', lastExport:null, onboarded:false, bar:20, plates:[25,20,15,10,5,2.5,1.25], sound:true},
    profile:{name:'', sex:'', birth:'', height:null, activity:'sed', bf:null},
    active:null,
    ui:{tab:'today', prog:'ex', period:'3m', exId:null, metric:'e1rm', calMonth:null, calSel:null, wPeriod:'3m', month:0}};
}

/* ---------- utilitaires ---------- */
function uid(){ return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function todayIso(){ return iso(new Date()); }
function pd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = pd(s); d.setDate(d.getDate()+n); return iso(d); }
function weekStart(s){ const d = pd(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); }
function daysBetween(a, b){ return Math.round((pd(b) - pd(a)) / 86400000); }
function fmtDay(s, o){ return pd(s).toLocaleDateString('fr-FR', o || {weekday:'short', day:'numeric', month:'short'}); }
function num(v){ if (v === null || v === undefined || v === '') return null; const n = parseFloat(String(v).replace(',', '.').replace(/\s/g,'')); return isFinite(n) ? n : null; }
function fN(n, dec){ if (n === null || n === undefined || !isFinite(n)) return '–'; return Number(n).toLocaleString('fr-FR', {maximumFractionDigits: dec === undefined ? 1 : dec, minimumFractionDigits: 0}); }
function fSign(n, dec){ return (n > 0 ? '+' : n < 0 ? '−' : '±') + fN(Math.abs(n), dec); }
function fTime(sec){ sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60) + ':' + pad(sec%60); }
function parseTime(v){ if (v === null || v === undefined) return null; const s = String(v).trim(); if (!s) return null; if (s.includes(':')) { const [m, x] = s.split(':'); return (parseInt(m)||0)*60 + (parseInt(x)||0); } const n = num(s); return n === null ? null : Math.round(n); }
function e1rm(w, r){ if (!w || !r) return 0; return r === 1 ? w : w * (1 + r/30); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

/* ---------- accès données ---------- */
function exById(id){ return S.exercises.find(e => e.id === id); }
function tplById(id){ return S.templates.find(t => t.id === id); }
function sortedSessions(){ return S.sessions.slice().sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.end||0) - (b.end||0)); }
function bwOn(date){
  let best = null;
  for (const w of S.weights) if (w.date <= date && (!best || w.date > best.date)) best = w;
  if (!best && S.weights.length) best = S.weights.slice().sort((a,b) => a.date < b.date ? -1 : 1)[0];
  return best ? best.kg : null;
}
/* charge réelle d'une série */
function setInfo(ex, s, date){
  if (!ex) return {load:0, reps:0, t:0};
  if (ex.type === 'duration') return {load:0, reps:0, t: parseTime(s.t) || 0};
  const reps = num(s.r) || 0;
  if (ex.type === 'weight') return {load: num(s.w) || 0, reps};
  const bw = bwOn(date) || 0, add = num(s.add) || 0;
  const load = s.mode === 'lest' ? bw + add : s.mode === 'assist' ? Math.max(0, bw - add) : bw;
  return {load, reps, add: s.mode === 'lest' ? add : s.mode === 'assist' ? -add : 0, bw};
}
function entryStats(ex, entry, date){
  const r = {e1rm:0, maxLoad:0, volume:0, maxReps:0, maxAdd:null, maxT:0, sets:0, bestSet:null};
  for (const s of entry.sets) {
    if (!s.done || s.kind === 'warm') continue;
    const i = setInfo(ex, s, date); r.sets++;
    if (ex.type === 'duration') { r.maxT = Math.max(r.maxT, i.t); continue; }
    const e = e1rm(i.load, i.reps);
    if (e > r.e1rm) { r.e1rm = e; r.bestSet = s; }
    r.maxLoad = Math.max(r.maxLoad, i.load); r.volume += i.load * i.reps; r.maxReps = Math.max(r.maxReps, i.reps);
    if (ex.type === 'bodyweight' && i.add !== undefined) r.maxAdd = r.maxAdd === null ? i.add : Math.max(r.maxAdd, i.add);
  }
  return r;
}
/* historique d'un exercice : [{date, session, entry, st}] trié */
function exHistory(exId, upto){
  const ex = exById(exId); const out = [];
  for (const s of sortedSessions()) {
    if (upto && s.date > upto) continue;
    for (const en of s.entries) if (en.exId === exId && en.sets.some(x => x.done && x.kind !== 'warm')) out.push({date:s.date, session:s, entry:en, st:entryStats(ex, en, s.date)});
  }
  return out;
}
function isWork(s){ return s.done && s.kind !== 'warm'; }
function records(exId, excludeSessionId){
  const ex = exById(exId); const r = {e1rm:0, maxLoad:0, maxReps:0, maxAdd:null, maxT:0, volume:0};
  for (const h of exHistory(exId)) {
    if (excludeSessionId && h.session.id === excludeSessionId) continue;
    const st = h.st; r.e1rm = Math.max(r.e1rm, st.e1rm); r.maxLoad = Math.max(r.maxLoad, st.maxLoad); r.maxReps = Math.max(r.maxReps, st.maxReps);
    r.maxT = Math.max(r.maxT, st.maxT); r.volume = Math.max(r.volume, st.volume);
    if (st.maxAdd !== null) r.maxAdd = r.maxAdd === null ? st.maxAdd : Math.max(r.maxAdd, st.maxAdd);
  }
  return r;
}
function setLabel(ex, s){
  if (!ex) return '';
  if (ex.type === 'duration') return fTime(parseTime(s.t) || 0);
  if (ex.type === 'weight') return fN(num(s.w)) + ' × ' + (num(s.r) ?? '–');
  const add = num(s.add) || 0;
  const pre = s.mode === 'lest' ? '+' + fN(add) + ' kg' : s.mode === 'assist' ? '−' + fN(add) + ' kg' : 'PDC';
  return pre + ' × ' + (num(s.r) ?? '–');
}

function chartWrap(svg, pts, VW, VH){
  return '<div class="chart" data-vw="' + VW + '" data-vh="' + VH + '" data-pts="' + esc(JSON.stringify(pts)) + '">' + svg + '<div class="guide" hidden></div><div class="hl" hidden></div><div class="tip" hidden></div></div>';

function chartPick(e){
  const c = e.target.closest && e.target.closest('.chart[data-pts]');
  if (!c) { document.querySelectorAll('.chart .tip, .chart .guide, .chart .hl').forEach(x => { x.hidden = true; }); return; }
  const svg = c.querySelector('svg'); if (!svg) return; const r = svg.getBoundingClientRect(); if (!r.width) return;
  let pts; try { pts = JSON.parse(c.dataset.pts); } catch (er) { return; } if (!pts.length) return;
  const vw = +c.dataset.vw, vh = +c.dataset.vh; const x = (e.clientX - r.left) / r.width * vw;
  let best = pts[0]; for (const q of pts) if (Math.abs(q.x - x) < Math.abs(best.x - x)) best = q;
  const px = best.x / vw * r.width, py = best.y / vh * r.height;
  const tip = c.querySelector('.tip'), g = c.querySelector('.guide'), hl = c.querySelector('.hl');
  tip.innerHTML = '<b>' + esc(best.v) + '</b><span>' + esc(best.t) + '</span>' + (best.s ? '<span>' + esc(best.s) + '</span>' : '');
  tip.hidden = false; g.hidden = false; hl.hidden = false;
  const tw = tip.offsetWidth || 120; tip.style.left = clamp(px, tw/2, r.width - tw/2) + 'px';
  g.style.left = px + 'px'; g.style.height = (r.height - 22) + 'px'; hl.style.left = px + 'px'; hl.style.top = py + 'px';
}

/* ---------- données d'exemple ---------- */
function makeDemo(){
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const X = n => S.exercises.find(e => e.name === n);
  const mk = (name, color, items) => ({id:uid(), name:name + ' (exemple)', color, transition:120, demo:true, items: items.map(([n,s,a,b,r]) => ({exId:X(n).id, sets:s, repMin:a, repMax:b, rest:r, note:''}))});
  const hA = mk('Haut A', COLORS[0], [['Développé couché',4,6,8,150],['Tractions',4,6,8,150],['Développé militaire',3,8,10,120],['Élévations latérales',4,12,15,75],['Curl incliné haltères',3,10,12,90]]);
  const bA = mk('Bas A', COLORS[1], [['Squat',4,5,7,180],['Soulevé de terre roumain',3,8,10,150],['Presse à cuisses',3,10,12,120],['Leg curl',3,10,12,90],['Gainage',3,45,60,60]]);
  const hB = mk('Haut B', COLORS[2], [['Développé incliné haltères',4,8,10,120],['Rowing barre',4,8,10,120],['Dips',3,8,10,120],['Élévations latérales',4,12,15,75],['Extension triceps poulie',3,10,12,90]]);
  S.templates.push(hA, bA, hB);
  const base = {'Développé couché':72.5,'Tractions':10,'Développé militaire':45,'Élévations latérales':10,'Curl incliné haltères':12,'Squat':100,'Soulevé de terre roumain':80,'Presse à cuisses':160,'Leg curl':40,'Gainage':45,'Développé incliné haltères':26,'Rowing barre':65,'Dips':5,'Extension triceps poulie':25};
  const t = todayIso(), ws = weekStart(t);
  for (let w = 8; w >= 0; w--) {
    const start = addDays(ws, -7*w);
    [[0,hA],[2,bA],[4,hB]].forEach(([off, tp]) => {
      const d = addDays(start, off); if (d >= t) return;
      const entries = tp.items.map(it => {
        const ex = exById(it.exId); const prog = Math.floor((8-w)/2) * ex.step * (ex.name === 'Développé militaire' && w < 3 ? 0 : 1);
        const sets = [];
        for (let i = 0; i < it.sets; i++) {
          const r = Math.round(it.repMin + rnd() * (it.repMax - it.repMin));
          if (ex.type === 'duration') sets.push({t: String(base[ex.name] + (8-w)*2 + Math.round(rnd()*8)), done:true});
          else if (ex.type === 'bodyweight') sets.push({mode:'lest', add: String(base[ex.name] + prog), r:String(r), done:true});
          else sets.push({w:String(base[ex.name] + prog), r:String(r), done:true});
        }
        return {exId:it.exId, sets, target:{sets:it.sets, repMin:it.repMin, repMax:it.repMax, rest:it.rest}, decision: w % 2 === 0 ? 'up' : 'keep'};
      });
      S.sessions.push({id:uid(), date:d, templateId:tp.id, name:tp.name, color:tp.color, start:0, end:pd(d).getTime(), duration:52 + Math.round(rnd()*15), rpe:7 + Math.round(rnd()), entries, demo:true});
    });

/* ================= SÉANCE EN COURS ================= */
function lastEntry(exId, before, excl){ const h = exHistory(exId).filter(x => x.date <= before && (!excl || x.session.id !== excl)); return h.length ? h[h.length-1] : null; }
function belowMin(ex, entry){
  const tg = entry.target; if (!tg) return false;
  return entry.sets.some(s => isWork(s) && (ex.type === 'duration' ? (parseTime(s.t)||0) < tg.repMin : (num(s.r)||0) < tg.repMin));
}
function suggest(entry){
  const ex = exById(entry.exId); const done = entry.sets.filter(isWork); if (!ex || !done.length) return null;
  const tg = entry.target; if (!tg) return 'keep';
  const val = s => ex.type === 'duration' ? (parseTime(s.t)||0) : (num(s.r)||0);
  if (done.length >= tg.sets && done.every(s => val(s) >= tg.repMax)) return 'up';
  if (done.some(s => val(s) < tg.repMin)) { const prev = lastEntry(entry.exId, S.active ? S.active.date : todayIso(), S.active && S.active.editing); return prev && prev.entry.below ? 'down' : 'keep'; }
  return 'keep';
}
function applyStep(ex, s, dir, tg){
  const k = dir === 'up' ? 1 : -1, st = ex.step || 2.5;
  if (ex.type === 'weight') { const w = num(s.w); if (w !== null) s.w = String(Math.max(0, Math.round((w + k*st)*100)/100)).replace('.', ','); if (dir === 'up' && tg) s.r = String(tg.repMin); }
  else if (ex.type === 'duration') { const t = parseTime(s.t); if (t !== null) s.t = String(Math.max(5, t + k*st)); }
  else {
    const add = num(s.add) || 0;
    if (s.mode === 'lest') { const n = Math.round((add + k*st)*100)/100; if (n <= 0) { s.mode = 'bw'; s.add = ''; } else s.add = String(n).replace('.', ','); if (dir === 'up' && tg) s.r = String(tg.repMin); }
    else if (s.mode === 'assist') { const n = Math.round((add - k*st)*100)/100; if (n <= 0) { s.mode = 'bw'; s.add = ''; } else s.add = String(n).replace('.', ','); }
    else { if (dir === 'up') { s.r = String((num(s.r)||0) + 1); } else { s.r = String(Math.max(1, (num(s.r)||1) - 1)); } }
  }
}
function buildEntry(exId, item, date){

  const last = lastEntry(exId, date);

  const n = item ? item.sets : Math.max(prevSets.length, 3);
  const sets = [];
  for (let i = 0; i < n; i++) {
    const p = prevSets[i] || prevSets[prevSets.length-1];
    const s = p ? {w:String(p.w||'').replace('.', ','), r:p.r||'', add:String(p.add||'').replace('.', ','), mode:p.mode||'bw', t:p.t||'', done:false} : {w:'', r:'', add:'', mode:'bw', t:'', done:false};
    sets.push(s);
  }

A.delSession = el => { const id = el.dataset.id; const k = S.sessions.findIndex(x => x.id === id); if (k < 0) return; const obj = S.sessions.splice(k, 1)[0]; save(); closeSheet(); render(); undoToast('Séance supprimée', () => S.sessions.splice(k, 0, obj)); };

/* ----- échauffement et disques ----- */
function barKg(ex){ return ex && ex.barKg ? ex.barKg : (S.settings.bar || 20); }
function roundLoad(ex, v){ const st = ex.bar ? Math.min(...(S.settings.plates||[1.25]))*2 : (ex.step || 2.5); return Math.round(v / st) * st; }
A.warmup = el => {
  const en = S.active.entries[+el.dataset.e], ex = exById(en.exId);
  if (en.sets.some(x => x.kind === 'warm')) { en.sets = en.sets.filter(x => x.kind !== 'warm' || x.done); save(); render(); return; }
  const work = en.sets.find(x => x.kind !== 'warm'); const W = work ? num(work.w) : null;
  if (!W) { toast('Entre d\'abord la charge de ta première série'); return; }
  const bar = ex.bar ? barKg(ex) : 0; const out = []; const seen = new Set();
  const plan = ex.bar ? [[0,10],[0.5,6],[0.7,4],[0.85,2]] : [[0.5,8],[0.7,5],[0.85,3]];
  for (const [pc, r] of plan) {
    let v = pc === 0 ? bar : roundLoad(ex, W * pc);
    if (ex.bar && v < bar) v = bar;
    if (v >= W || v <= 0 || seen.has(v)) continue; seen.add(v);
    out.push({w: String(v).replace('.', ','), r: String(r), add:'', mode:'bw', t:'', done:false, kind:'warm'});
  }
  if (!out.length) { toast('Charge trop légère pour un échauffement progressif'); return; }
  const idx = en.sets.indexOf(work); en.sets.splice(idx, 0, ...out); save(); render();
};
function platesFor(total, bar){
  const plates = (S.settings.plates || []).slice().sort((a,b) => b - a); let side = (total - bar) / 2; const out = [];
  if (side < 0) return {out, rest: side, side};
  for (const p of plates) { while (side >= p - 1e-9) { out.push(p); side = Math.round((side - p)*1000)/1000; } }
  return {out, rest: side, side: (total - bar)/2};
}
const PLATE_COL = {25:'#D9534F', 20:'#4A7BD0', 15:'#E8C547', 10:'#4FA86A', 5:'#E8E8E0', 2.5:'#3A3F46', 1.25:'#9AA0A6'};
function plateBar(list){
  let x = 4; let g = '';
  for (const p of list) { const h = 16 + Math.min(p, 25) * 2.4, w = p >= 10 ? 12 : p >= 5 ? 9 : 7; g += '<rect x="' + x + '" y="' + (40 - h/2) + '" width="' + w + '" height="' + h + '" rx="2" style="fill:' + (PLATE_COL[p] || '#9AA0A6') + ';stroke:var(--bg);stroke-width:1"/>'; x += w + 2; }
  return '<svg viewBox="0 0 160 80" width="160" height="80" role="img" aria-label="Disques par côté : ' + list.map(p => fN(p,2)).join(', ') + '"><rect x="0" y="36" width="160" height="8" rx="3" style="fill:var(--line-2)"/>' + g + '</svg>';
}
A.plates = el => { const en = S.active.entries[+el.dataset.e], ex = exById(en.exId); openSheet(() => {
  const bar = barKg(ex); const ws = [...new Set(en.sets.map(x => num(x.w)).filter(v => v))];
  let h = '<h2>Disques · ' + esc(ex.name) + '</h2><p class="small muted" style="margin:0">Barre de ' + fN(bar,1) + ' kg. Disques indiqués pour un côté.</p>';
  if (!ws.length) h += '<div class="empty">Entre une charge sur une série pour voir les disques à mettre.</div>';
  for (const w of ws) { const r = platesFor(w, bar);
    h += '<div class="card" style="padding:12px;gap:6px"><div class="row between"><span class="big" style="font-size:22px">' + fN(w,2) + ' kg</span><span class="small muted">' + (r.side < 0 ? 'moins que la barre' : r.out.length ? r.out.map(p => fN(p,2)).join(' + ') : 'barre seule') + '</span></div>' + (r.out.length ? plateBar(r.out) : '') + (r.rest > 0.001 ? '<span class="xs" style="color:var(--warn)">Il manque ' + fN(r.rest*2,2) + ' kg pour tomber juste avec tes disques.</span>' : '') + '</div>'; }
  return h + '<button type="button" class="btn sec full" data-act="close">Fermer</button>';
}); };

/* ----- steppers − / + sur la série en cours ----- */
function stepperHtml(ex, s, ei, si){
  const b = (f, d, l) => '<button type="button" class="stp" data-act="step" data-e="' + ei + '" data-s="' + si + '" data-f="' + f + '" data-d="' + d + '" aria-label="' + l + '">' + (d > 0 ? '+' : '−') + '</button>';
  const grp = (lab, f, unit) => '<div class="stpg"><span class="xs muted" style="font-weight:700">' + lab + '</span><div class="row" style="gap:6px">' + b(f, -1, lab + ' moins ' + unit) + b(f, 1, lab + ' plus ' + unit) + '</div></div>';
  let g = '';
  if (ex.type === 'duration') g = grp('Durée ±5 s', 't', '5 secondes');
  else { if (ex.type === 'weight') g += grp('Charge ±' + fN(ex.step || 2.5, 2), 'w', fN(ex.step || 2.5, 2) + ' kilo');
    else if (s.mode && s.mode !== 'bw') g += grp((s.mode === 'lest' ? 'Lest' : 'Aide') + ' ±' + fN(ex.step || 1.25, 2), 'add', fN(ex.step || 1.25, 2) + ' kilo');
    g += grp('Reps', 'r', 'une rep'); }
  return '<div class="stepper">' + g + '</div>';
}
A.step = el => {
  const en = S.active.entries[+el.dataset.e], s = en.sets[+el.dataset.s], ex = exById(en.exId), f = el.dataset.f, d = +el.dataset.d, tg = en.target;
  if (f === 'r') { const v = num(s.r); s.r = String(Math.max(0, (v === null ? (tg ? tg.repMax : 8) : v) + d)); }

/* ----- récap de fin de séance ----- */
function recapSheet(id){
  const s = S.sessions.find(x => x.id === id); if (!s) return '';
  const sets = s.entries.reduce((n, e) => n + e.sets.filter(isWork).length, 0), ton = sessionTonnage(s), prs = s.entries.reduce((n, e) => n + (e.prs||0), 0);
  const prev = sortedSessions().filter(x => x.id !== s.id && x.date <= s.date && (s.templateId ? x.templateId === s.templateId : true)).pop();
  const d = (a, b, f) => { const x = a - b; if (Math.abs(x) < 1e-9) return '<span class="badge soft">=</span>'; return '<span class="badge" style="background:' + (x > 0 ? 'var(--good-soft)' : 'var(--bad-soft)') + ';color:' + (x > 0 ? 'var(--good)' : 'var(--bad)') + '">' + (x > 0 ? '▲ +' : '▼ −') + f(Math.abs(x)) + '</span>'; };
  let h = '<div class="stack-s" style="align-items:center;text-align:center;gap:4px;padding-top:4px"><span style="color:var(--accent)">' + ic('check', 40, 2.5) + '</span><h2>' + (S.profile.name ? 'Bien joué ' + esc(S.profile.name) : 'Séance terminée') + '</h2><span class="small muted">' + esc(s.name) + ' · ' + s.duration + ' min</span></div>';

  if (prev) h += '<span class="xs muted" style="text-align:center">Comparé à ta séance du ' + esc(fmtDay(prev.date, {day:'numeric', month:'long'})) + '</span>';

  if (prList.length) h += '<div class="card" style="padding:12px 14px;gap:6px;background:var(--accent-soft);border-color:transparent"><span style="font-weight:800">' + ic('trophy', 18) + ' ' + prs + ' record' + (prs>1?'s':'') + '</span>' + prList.map(x => '<span class="small">' + x + '</span>').join('') + '</div>';

  return h + '<button type="button" class="btn full" data-act="close">Fermer</button>';

/* ----- supersets ----- */
function groupBounds(i){ const E = S.active.entries; let a = i, b = i; while (a > 0 && E[a-1].ss) a--; while (b < E.length - 1 && E[b].ss) b++; return [a, b]; }
function nextFocus(){
  const E = S.active ? S.active.entries : []; let i = 0;
  while (i < E.length) { const [a, b] = groupBounds(i);
    if (a === b) { const k = E[i].sets.findIndex(x => !x.done); if (k >= 0) return {e:i, s:k}; }
    else { const mx = Math.max(...E.slice(a, b+1).map(e => e.sets.length));
      for (let k = 0; k < mx; k++) for (let j = a; j <= b; j++) if (E[j].sets[k] && !E[j].sets[k].done) return {e:j, s:k}; }
    i = b + 1; }
  return null;
}
function ssLabel(ei){ const E = S.active.entries; const [a, b] = groupBounds(ei); if (a === b) return ''; let g = 0; for (let i = 0; i < a; ) { const [x, y] = groupBounds(i); if (x !== y) g++; i = y + 1; } return 'Superset ' + String.fromCharCode(65 + g) + (ei - a + 1); }

function streakWeeks(){
  let n = 0, ws = weekStart(todayIso());
  const count = w => itemsOnRange(w, addDays(w,6));
  if (count(ws) < 3) ws = addDays(ws, -7);
  while (count(ws) >= 3 && n < 520) { n++; ws = addDays(ws, -7); }
  return n;
}

/* ================= POIDS ================= */
function setWeight(date, kg){ const i = S.weights.findIndex(w => w.date === date); if (i >= 0) S.weights[i] = {date, kg}; else S.weights.push({date, kg}); S.weights.sort((a,b) => a.date < b.date ? -1 : 1); save(); }
function weekAvg(ws){ const L = S.weights.filter(w => w.date >= ws && w.date <= addDays(ws,6)); return L.length ? L.reduce((a,w) => a + w.kg, 0) / L.length : null; }
function weeklyAvgs(){ const m = {}; for (const w of S.weights) { const k = weekStart(w.date); (m[k] = m[k] || []).push(w.kg); } return Object.keys(m).sort().map(k => ({ws:k, avg: m[k].reduce((a,b) => a+b, 0) / m[k].length, n:m[k].length})); }
function avgNear(list, ws){ let best = null; for (const x of list) if (x.ws <= ws) best = x; return best; }
/* ----- tendance lissée (moyenne pondérée vers les pesées récentes, jours manquants interpolés) ----- */
let TREND_CACHE = {key:'', out:[]};
function trendSeries(){
  const W = S.weights.slice().sort((a,b) => a.date < b.date ? -1 : 1);
  const key = W.length + '|' + (W.length ? W[0].date + W[W.length-1].date + W[W.length-1].kg : '') + '|' + W.reduce((a,w) => a + w.kg, 0);

function parseCsv(txt){

/* ----- comparaison mois vs mois ----- */
function monthStats(a, b){
  const Ss = S.sessions.filter(s => s.date >= a && s.date <= b), As = S.activities.filter(x => x.date >= a && x.date <= b);
  const sm = setsByMuscle(a, b);
  return {n:Ss.length, foot:As.filter(x => (x.kind||'foot') === 'foot').length, pool:As.filter(x => x.kind === 'piscine').length, mins: Ss.reduce((x,s) => x + (s.duration||0), 0) + As.reduce((x,s) => x + (s.duration||0), 0),
    ton: Ss.reduce((x,s) => x + sessionTonnage(s), 0), prs: Ss.reduce((x,s) => x + s.entries.reduce((y,e) => y + (e.prs||0), 0), 0),
    sets: Object.values(sm).reduce((x,y) => x + y, 0), sm, trendEnd: trendOn(b > todayIso() ? todayIso() : b)};
}
function duel(label, v1, v0, fmt, unitDelta, good){
  good = good === undefined ? 1 : good;
  if (v1 === null || v0 === null) return '<div class="tile" style="background:var(--surface);gap:6px"><span class="xs muted">' + label + '</span><span class="big">' + (v1 === null ? '–' : fmt(v1)) + '</span><span class="xs muted">avant : ' + (v0 === null ? '–' : fmt(v0)) + '</span></div>';
  const mx = Math.max(v1, v0, 1e-9); const d = v1 - v0; const same = Math.abs(d) < 1e-9;
  const up = d > 0; const better = good === 0 ? null : (up === (good > 0));
  const col = same || better === null ? 'var(--muted)' : better ? 'var(--good)' : 'var(--bad)';
  const bg = same || better === null ? 'var(--line)' : better ? 'var(--good-soft)' : 'var(--bad-soft)';
  const pill = '<span class="badge" style="background:' + bg + ';color:' + col + '">' + (same ? '=' : (up ? '▲ +' : '▼ −') + unitDelta(Math.abs(d))) + '</span>';
  return '<div class="tile" style="background:var(--surface);gap:6px"><div class="row between" style="gap:6px"><span class="xs muted">' + label + '</span>' + pill + '</div><span class="big">' + fmt(v1) + '</span>' +
    '<span class="stack-s" style="gap:3px"><span class="hbar" style="height:6px;background:var(--line)"><span class="v" style="top:0;height:6px;width:' + (v1/mx*100) + '%;background:var(--data)"></span></span><span class="hbar" style="height:6px;background:var(--line)"><span class="v" style="top:0;height:6px;width:' + (v0/mx*100) + '%;background:var(--line-2)"></span></span></span><span class="xs muted">avant : ' + fmt(v0) + '</span></div>';
}
function monthCompare(){
  const off = S.ui.month || 0; const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + off);
  const p = new Date(d.getFullYear(), d.getMonth()-1, 1);
  const rng = x => [iso(x).slice(0,7) + '-01', iso(new Date(x.getFullYear(), x.getMonth()+1, 0))];
  const [a1, b1] = rng(d); let [a0, b0] = rng(p); let b1e = b1; if (off === 0) { const lim = addDays(a0, new Date().getDate() - 1); if (lim < b0) b0 = lim; b1e = todayIso(); }
  const A1 = monthStats(a1, b1), A0 = monthStats(a0, b0);
  const m1 = d.toLocaleDateString('fr-FR', {month:'long'}), m0 = p.toLocaleDateString('fr-FR', {month:'long'});
  let h = '<section class="card" style="padding:14px;gap:12px"><div class="row between"><div class="stack-s" style="gap:0"><span style="font-weight:800;font-size:18px"><span style="text-transform:capitalize">' + esc(m0) + '</span> vs ' + esc(m1) + '</span><span class="xs muted">' + (off === 0 ? 'du 1er au ' + pd(b1e).getDate() + ' dans les deux mois' : 'mois complets') + '</span></div><div class="row" style="gap:6px"><button type="button" class="icon-btn" style="width:36px;height:36px" data-act="month" data-d="-1" aria-label="Mois précédent">' + ic('left',16) + '</button><button type="button" class="icon-btn" style="width:36px;height:36px" data-act="month" data-d="1" aria-label="Mois suivant"' + (off >= 0 ? ' disabled' : '') + '>' + ic('right',16) + '</button></div></div>';
  // phrase de synthèse
  const parts = []; const dn = A1.n - A0.n, dt = A1.ton - A0.ton;
  if (dn) parts.push(Math.abs(dn) + ' séance' + (Math.abs(dn)>1?'s':'') + ' de ' + (dn > 0 ? 'plus' : 'moins'));
  if (Math.abs(dt) >= 100) parts.push(fN(Math.abs(dt)/1000, 1) + ' t ' + (dt > 0 ? 'de plus soulevées' : 'de moins soulevées'));
  if (A1.prs) parts.push(A1.prs + ' record' + (A1.prs>1?'s':'') + ' battu' + (A1.prs>1?'s':''));
  if (A1.n || A0.n) h += '<p style="margin:0;font-size:15px">' + (parts.length ? 'En ' + esc(m1) + ' : ' + parts.join(', ') + ' par rapport à ' + esc(m0) + '.' : 'Même rythme qu\'en ' + esc(m0) + '.') + '</p>';
  const n0 = v => fN(v, 0), hm = v => v < 60 ? Math.round(v) + ' min' : Math.floor(v/60) + ' h ' + pad(Math.round(v%60)), tn = v => fN(v/1000, 1) + ' t';
  const ph = curPhase(); const wGood = !ph ? 0 : ph.type === 'prise' ? 1 : ph.type === 'seche' ? -1 : ph.type === 'perso' && ph.target ? (ph.target > (A0.trendEnd||0) ? 1 : -1) : 0;
  const kg1 = v => fN(v, 1) + ' kg', kgd = v => fN(v, 1) + ' kg';
  h += '<div class="grid2">' + duel('Poids (tendance)', A1.trendEnd ?? null, A0.trendEnd ?? null, kg1, kgd, wGood) + duel('Séances muscu', A1.n, A0.n, n0, n0) + duel('Volume soulevé', A1.ton, A0.ton, tn, tn) + duel('Séries de travail', A1.sets, A0.sets, n0, n0) + duel('Temps d\'entraînement', A1.mins, A0.mins, hm, hm) + duel('Foot', A1.foot, A0.foot, n0, n0) + duel('Natation', A1.pool, A0.pool, n0, n0) + duel('Records', A1.prs, A0.prs, n0, n0) + '</div>';
  const G = [['Dos',['Dos']],['Pecs',['Pecs']],['Bras',['Biceps','Triceps']],['Jambes',['Quadriceps','Ischios','Fessiers','Mollets']],['Épaules',['Épaules']],['Abdos',['Abdos']]];
  const gs = (sm, L) => L.reduce((a, m) => a + (sm[m]||0), 0);
  h += '<span class="small" style="font-weight:700;margin-top:2px">Séries par groupe musculaire</span><div class="grid2">' + G.map(([l, L]) => duel(l, gs(A1.sm, L), gs(A0.sm, L), n0, n0)).join('') + '</div>';
  return h + '</section>';
}
A.month = el => { S.ui.month = Math.min(0, (S.ui.month||0) + (+el.dataset.d)); save(); render(); };

/* ================= DÉMARRAGE ================= */
load();
render();
setTimeout(hideSplash, 900);

/* ----- totaux d'un exercice ----- */
function sumEx(ex, L){
  const r = {sessions:L.length, sets:0, reps:0, ton:0, time:0};
  for (const x of L) for (const s of x.entry.sets) { if (!isWork(s)) continue; const i = setInfo(ex, s, x.date); r.sets++; if (ex.type === 'duration') r.time += i.t; else { r.reps += i.reps; r.ton += i.load * i.reps; } }
  return r;
}
function fTon(kg){ return kg >= 1000 ? fN(kg/1000, 1) + ' t' : fN(kg, 0) + ' kg'; }
function fLong(sec){ const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60); return h ? h + ' h ' + pad(m) : m + ' min'; }
function exRank(exId){
  const cnt = {}; for (const ss of S.sessions) for (const e of ss.entries) { const n = e.sets.filter(isWork).length; if (n) cnt[e.exId] = (cnt[e.exId]||0) + n; }
  const ids = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]); return {rank: ids.indexOf(exId) + 1, total: ids.length};
}
function exTotals(ex, H){
  if (!H.length) return '';
  const A = sumEx(ex, H), R = exRank(ex.id);
  const t = (l, v, sub) => '<div class="tile" style="background:var(--surface);padding:12px"><span class="xs muted">' + l + '</span><span class="big" style="font-size:24px">' + v + '</span>' + (sub ? '<span class="xs muted">' + sub + '</span>' : '') + '</div>';
  const rank = t('Classement', R.rank + ' <span style="font-size:15px;font-weight:600;color:var(--muted)">sur ' + R.total + '</span>', 'par nombre de séries');
  const tiles = ex.type === 'duration' ? t('Séries', fN(A.sets, 0)) + t('Temps total', fLong(A.time)) + rank : t('Séries', fN(A.sets, 0)) + t('Reps', fN(A.reps, 0)) + rank + t('Poids total', fTon(A.ton), ex.type === 'bodyweight' ? 'poids du corps + lest' : '');
  return '<section class="stack-s"><span class="eyebrow">Depuis le début</span><div class="grid2">' + tiles + '</div><span class="xs muted">' + A.sessions + ' séance' + (A.sessions > 1 ? 's' : '') + ' depuis le ' + esc(fmtDay(H[0].date, {day:'numeric', month:'long', year:'numeric'})) + '</span></section>';
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
